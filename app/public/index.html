<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Files web</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Files">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0b0e" media="(prefers-color-scheme: dark)">
<script>try{var t=JSON.parse(localStorage.getItem('fm_thema'));if(innerWidth>640&&(t==='light'||t==='dark'))document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<style>
  :root {
    color-scheme: dark;
    /* donker: heel donkere blauwe tinten in plaats van zwart */
    --bg: #0a0b0e; --text: #f0f2f5; --muted: #959aa6; --card: #181a1f;
    --line: rgba(200, 212, 235, 0.10); --accent: #2ea0ff; --ok: #3ddc97; --warn: #ffb547; --bad: #ff6b81;
    --field: #25282f; --btn: #25282f; --track: #272a32; --on-accent: #ffffff;
    --hover: rgba(200, 212, 235, 0.06); --seg-on: #353944; --zebra: rgba(200, 212, 235, 0.028); --kies: rgba(46, 160, 255, 0.22); --mapglyph: #1f7fd4;
    --schaduw: 0 20px 60px rgba(0, 0, 0, 0.45);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { color-scheme: light;
      --bg: #f5f5f7; --text: #1d1d1f; --muted: #6e6e73; --card: #ffffff; --line: rgba(0, 0, 0, 0.10);
      --accent: #1a7fd6; --ok: #12865a; --warn: #a15c00; --bad: #c8304a;
      --field: #f5f5f7; --btn: #f0f0f2; --track: #e8e8ea; --hover: rgba(0, 0, 0, 0.05); --seg-on: #ffffff; --zebra: rgba(0, 0, 0, 0.022);
      --kies: rgba(26, 127, 214, 0.17); --mapglyph: #1563ae; --schaduw: 0 20px 60px rgba(0, 0, 0, 0.18); }
  }
  :root[data-theme="light"] { color-scheme: light;
    --bg: #f5f5f7; --text: #1d1d1f; --muted: #6e6e73; --card: #ffffff; --line: rgba(0, 0, 0, 0.10);
    --accent: #1a7fd6; --ok: #12865a; --warn: #a15c00; --bad: #c8304a;
    --field: #f5f5f7; --btn: #f0f0f2; --track: #e8e8ea; --hover: rgba(0, 0, 0, 0.05); --seg-on: #ffffff; --zebra: rgba(0, 0, 0, 0.022);
    --kies: rgba(26, 127, 214, 0.17); --mapglyph: #1563ae; --schaduw: 0 20px 60px rgba(0, 0, 0, 0.18); }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; scrollbar-gutter: stable; }
  .nm .t, .zn, .zv, .kruimels a { overflow-wrap: anywhere; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    padding: calc(28px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  /* breedte: op een laptop zoals voorheen (1320px), op grotere schermen meegroeiend tot 88% van de breedte, met rust eromheen */
  .wrap { max-width: clamp(1320px, 88vw, 2400px); margin: 0 auto; }
  [hidden] { display: none !important; }
  svg { flex-shrink: 0; }

  /* kop, gelijk aan Rclone web */
  .titel { display: flex; align-items: center; gap: 12px; }
  .titel h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; line-height: 1; }
  h1 .accent { color: #70caf2; }
  h1 .dun { font-weight: 300; }
  .logo { width: 40px; height: 40px; flex-shrink: 0; }
  .sub { color: var(--muted); margin-top: 10px; font-size: 0.9rem; }
  @media (max-width: 560px) { .titel h1 { font-size: 1.4rem; } .logo { width: 34px; height: 34px; } .titel { gap: 10px; } }
  /* ---------- telefoon: alleen het hoognodige ---------- */
  @media (max-width: 640px) {
    .tabbalk, #ondertitel, .thema, .voetrij, #vooruitBtn, .lijstkop, .greep { display: none !important; }
    .bovenrij { align-items: center !important; } .bovenrij .rechtsboven { margin-top: 0; }
    .kern > .card, .hoofd > .card { margin-top: 14px; }
  }
  /* telefoon: bovenin compacter, zodat takenknop, dag/nacht en uitloggen naast de titel passen */
  @media (max-width: 560px) {
    .titel h1 { font-size: 1.15rem; letter-spacing: 0.02em; } .logo { width: 28px; height: 28px; } .titel { gap: 7px; }
    .rechtsboven { gap: 2px; }
    .rechtsboven .thema button { padding: 5px 6px; font-size: 0.72rem; }
    .rechtsboven .uitlog { width: 32px; height: 32px; }
    .takenknop { height: 34px; padding: 0 10px 0 4px; gap: 6px; font-size: 0.8rem; }
    .takenknop .tpijl { display: none; }
  }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 20px; margin-top: 20px; }
  .card h2, .kopje { font-size: 0.8rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .kaartkop { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }

  button {
    font: inherit; font-size: 0.95rem; border-radius: 10px; padding: 11px 16px; border: 1px solid var(--line);
    background: var(--btn); color: var(--text); cursor: pointer; white-space: nowrap;
  }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: 0.45; cursor: default; border-color: var(--line); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  button.gevaar { background: var(--bad); border-color: var(--bad); color: #fff; font-weight: 600; }
  button.small { padding: 7px 11px; font-size: 0.85rem; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[type=text], input[type=password], input[type=search] {
    width: 100%; background: var(--field); color: var(--text); border: 1px solid var(--line); border-radius: 10px;
    padding: 11px 12px; font: inherit; font-size: 16px; min-width: 0;
  }
  input:focus { outline: none; border-color: var(--accent); }
  .hint { font-size: 0.85rem; color: var(--muted); line-height: 1.45; }
  .msg { margin-top: 12px; font-size: 0.9rem; line-height: 1.5; white-space: pre-line; }
  .msg:empty { display: none; }
  .msg.bad { color: var(--bad); } .msg.ok { color: var(--ok); } .msg.warn { color: var(--warn); }

  .rondknop { flex-shrink: 0; width: 34px; height: 34px; padding: 0; border-radius: 50%; display: grid; place-items: center; cursor: pointer;
    color: var(--accent); background: rgba(46, 160, 255, 0.12); border: 1px solid rgba(46, 160, 255, 0.25); transition: background 0.15s, border-color 0.15s; }
  .rondknop svg { width: 17px; height: 17px; }
  .rondknop:hover { background: rgba(46, 160, 255, 0.2); border-color: rgba(46, 160, 255, 0.45); }
  .icoknop { flex-shrink: 0; width: 34px; height: 34px; padding: 0; border-radius: 10px; display: grid; place-items: center; color: var(--muted); background: transparent; border: 1px solid transparent; }
  .icoknop:hover { color: var(--text); background: var(--hover); border-color: transparent; }
  .icoknop svg { width: 19px; height: 19px; }
  .icoknop.aan { color: var(--accent); }

  /* ---------- Inloggen ---------- */
  #loginView { min-height: 70vh; display: grid; place-items: center; }
  .loginkaart { width: 100%; max-width: 380px; padding: 28px 24px; }
  .loginkaart .titel { justify-content: center; }
  .loginkaart .sub { text-align: center; margin-bottom: 18px; }
  .loginkaart label { display: block; font-size: 0.85rem; color: var(--muted); margin: 12px 0 6px; }
  .loginkaart button { width: 100%; margin-top: 20px; padding: 13px; }

  .balk { height: 8px; border-radius: 999px; background: var(--track); overflow: hidden; margin-top: 12px; }
  .balk div { height: 100%; background: var(--accent); border-radius: 999px; transition: width 0.4s ease; }
  .balk.warn div { background: var(--warn); } .balk.bad div { background: var(--bad); }

  /* ---------- Zijbalk ---------- */
  .indeling { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 20px; align-items: start; }
  /* rechterkolom altijd tot onderaan het scherm, voet blijft onderin */
  .hoofd { min-width: 0; display: flex; flex-direction: column; min-height: calc(100vh - var(--boven, 160px) - 70px - env(safe-area-inset-bottom)); }
  @supports (height: 100dvh) { .hoofd { min-height: calc(100dvh - var(--boven, 160px) - 70px - env(safe-area-inset-bottom)); } }
  @media (max-width: 640px) { .hoofd { min-height: calc(100vh - var(--boven, 160px) - 20px - env(safe-area-inset-bottom)); } }
  .hoofd > .card:not([hidden]) { flex: 1; display: flex; flex-direction: column; }
  /* tabbladen: vast aan de kaart, als de tabs van een archiefmap */
  .tabbalk { position: relative; z-index: 2; display: flex; align-items: flex-end; gap: 0; margin: 20px 0 -1px; padding: 0 22px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
  .tabbalk::-webkit-scrollbar { display: none; }
  /* schuine zijkanten ("dakje"): de vorm wordt getekend door ::before, met een beetje perspectief */
  .tab { position: relative; z-index: 1; display: flex; align-items: center; gap: 7px; flex: 0 1 220px; min-width: 100px; height: 34px; padding: 0 14px 0 20px; margin: 0 -5px;
    background: transparent; color: var(--muted); font-size: 0.86rem; cursor: pointer; user-select: none; -webkit-user-select: none; }
  .tab::before { content: ''; position: absolute; z-index: -1; left: 0; right: 0; top: 0; bottom: 1px; background: var(--track);
    border: 1px solid var(--line); border-bottom: none; border-radius: 9px 9px 0 0;
    transform: perspective(70px) rotateX(4deg); transform-origin: bottom; }
  .tab:hover { color: var(--text); }
  .tab:hover::before { background: var(--field); }
  .tab.actief { z-index: 3; height: 38px; color: var(--accent); font-weight: 600; }
  .tab.actief::before { background: var(--card); bottom: 0; }
  .tab > svg { width: 16px; height: 16px; flex-shrink: 0; }
  .tab > svg.map { color: var(--accent); }
  .tab:not(.actief) > svg { opacity: 0.75; }
  .tab .tn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab .tdicht { width: 22px; height: 22px; padding: 0; border: none; border-radius: 6px; background: transparent; color: var(--muted); display: grid; place-items: center; flex-shrink: 0; opacity: 0; }
  .tab .tdicht svg { width: 12px; height: 12px; }
  .tab:hover .tdicht, .tab.actief .tdicht { opacity: 1; }
  .tab .tdicht:hover { background: var(--hover); color: var(--bad); }
  .tabbalk.een .tdicht { display: none; }
  .tabnieuw { flex-shrink: 0; align-self: center; width: 30px; height: 30px; margin-left: 4px; padding: 0; border-radius: 9px; border: none; background: transparent; color: var(--muted); display: grid; place-items: center; }
  .tabnieuw:hover { color: var(--accent); background: var(--hover); }
  .tabnieuw svg { width: 17px; height: 17px; }
  @media (hover: none) { .tab .tdicht { opacity: 0.7; } }
  @media (max-width: 640px) { .tabbalk { margin-top: 18px; padding: 0 10px; } .tab { flex: 0 0 auto; max-width: 160px; min-width: 0; } }
  #mapView #items { flex: 1; }
  #mapView .voetje { margin-top: auto; }
  /* ruimte onderin zodat de zwevende balken niets afdekken */
  body.balk-onder .hoofd { padding-bottom: 96px; }
  .zijbalk { position: relative; margin-top: 20px; background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 16px 10px 10px; }
  .zijbalk .kopje { padding: 0 10px 8px; display: block; }
  .zijbalk .kopje2 { margin-top: 14px; }
  /* zijbalk: nooit scrollen binnen de kolom; schijven met wat meer lucht */
  .zijbalk.plak { position: sticky; top: 16px; }
  #zijSchijven .zijitem { padding-top: 10px; padding-bottom: 10px; margin-top: 5px; }
  #zijSchijven .zijitem:first-child { margin-top: 2px; }
  .zijitem.fav { cursor: pointer; padding-right: 58px; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .zijitem.fav.sleept { z-index: 5; background: var(--card); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25); outline: 1px solid var(--accent); cursor: grabbing; transition: none; }
  #zijFav.sleepmodus .zijitem.fav:not(.sleept) { transition: transform 0.15s ease; }
  #zijFav.sleepmodus .favweg { opacity: 0 !important; }
  .zijitem.fav > svg { width: 26px; height: 26px; margin-left: -2px; margin-right: -1px; }   /* favorieten: geel mapje, iets groter */
  .zijitem.fav.weg { opacity: 0.55; }
  .zijitem.fav.weg > svg { filter: grayscale(1); opacity: 0.6; }
  .greep { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 22px; height: 30px; display: grid; place-items: center; color: var(--muted); opacity: 0.55; cursor: grab; touch-action: none; }
  .greep svg { width: 16px; height: 16px; }
  .zijitem.fav:hover .greep { opacity: 0.9; }
  .zijitem.fav.sleept .greep { cursor: grabbing; opacity: 1; color: var(--accent); }
  #zijFav:has(.zijitem.fav:only-child) .greep { display: none; }
  .favweg { position: absolute; right: 30px; top: 50%; transform: translateY(-50%); width: 26px; height: 26px; padding: 0; border: none; border-radius: 7px; background: transparent; color: var(--muted); display: grid; place-items: center; opacity: 0; }
  .favweg svg { width: 14px; height: 14px; }
  .favweg:hover { color: var(--bad); background: var(--hover); }
  .zijitem.fav:hover .favweg, .zijitem.fav:focus-within .favweg { opacity: 1; }
  @media (hover: none) { .favweg { opacity: 0.6; } }
  .favleeg { font-size: 0.78rem; color: var(--muted); padding: 2px 10px 4px; line-height: 1.45; }
  .zijitem { position: relative; display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; border: none; background: transparent; border-radius: 11px; padding: 9px 10px; margin-top: 2px; color: var(--text); }
  .zijitem:hover { background: var(--hover); }
  .stip { position: absolute; top: 11px; right: 12px; width: 8px; height: 8px; border-radius: 50%; }
  /* bolletjes: vaste, heldere kleuren in dag- en nachtmodus */
  .stip.ok { background: #32e06a; } .stip.warn { background: #ffa51f; } .stip.bad { background: #ff453a; }
  .zijitem.actief { background: var(--kies); }
  .zijitem.actief .zn { color: var(--accent); }
  .zijitem > svg { width: 22px; height: 22px; color: var(--accent); }
  .zijitem.bakje > svg { color: var(--muted); }
  .zijitem.los { opacity: 0.6; cursor: default; }
  .zijitem.los > svg, .zijitem.los .zv { color: var(--warn); }
  .zw { flex: 1; min-width: 0; display: block; }
  .zn .soort { font-size: 0.62rem; font-weight: 600; letter-spacing: 0.06em; color: var(--muted); margin-left: 7px; opacity: 0.8; vertical-align: 1px; }
  .zn { display: block; font-weight: 600; font-size: 0.92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .zijitem .balk { display: block; height: 4px; margin-top: 6px; }
  .zv { display: block; font-size: 0.74rem; color: var(--muted); margin-top: 4px; white-space: nowrap; }
  .zijbalk hr { border: none; border-top: 1px solid var(--line); margin: 8px 6px; }
  .menuknop { display: none; }
  .zijachter { display: none; }
  @media (max-width: 900px) {
    .indeling { grid-template-columns: minmax(0, 1fr); }
    .zijbalk { position: fixed; z-index: 66; top: 0; bottom: 0; left: 0; margin: 0; width: min(290px, 85vw); max-height: none; border-radius: 0 9px 9px 0;
      padding-top: calc(18px + env(safe-area-inset-top)); padding-bottom: calc(14px + env(safe-area-inset-bottom));
      transform: translateX(-105%); transition: transform 0.22s ease; box-shadow: var(--schaduw); }
    .zijbalk.open { transform: none; }
    .zijachter.open { display: block; position: fixed; inset: 0; z-index: 65; background: rgba(0, 0, 0, 0.4); }
    .menuknop { display: grid; margin-right: 2px; }
  }
  /* op de computer staat de schijf al gemarkeerd in de zijbalk: geen dubbele naam, kolommen op gelijke hoogte */
  @media (min-width: 901px) {
    .indeling { margin-top: 22px; }
    .zijbalk, .hoofd > .card { margin-top: 0; }
    .tabbalk { margin-top: 0; }
    .zijbalk { margin-top: 37px; }
    .kruimels .wn { display: none; }
    .rij-kruimels.wortel .kruimels { visibility: hidden; }
    /* één groot vlak: zijbalk en mapinhoud samen, met een scheidingslijn ertussen */
    body.samen .indeling { position: relative; isolation: isolate; gap: 0; }
    body.samen .indeling::before { content: ''; position: absolute; z-index: -1; left: 0; right: 0; top: 37px; bottom: 0;
      background: var(--card); border: 1px solid var(--line); border-radius: 9px; }
    body.samen.balk-onder .indeling::before { bottom: 96px; }
    body.samen .zijbalk { background: transparent; border: none; border-radius: 0; padding-top: 20px; }
    body.samen .hoofd > .card { background: transparent; border: none; border-left: 1px solid var(--line); border-radius: 0 18px 18px 0; padding-left: 24px; }
  }
  .rij-kruimels { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0; margin-left: -4px; }
  .kruimels a.wortelknop { display: inline-flex; align-items: center; gap: 6px; }
  .kruimels a.wortelknop svg { width: 18px; height: 18px; }

  /* ---------- Kruimelpad ---------- */
  .kruimels { display: flex; align-items: center; gap: 2px; min-width: 0; overflow-x: auto; scrollbar-width: none; white-space: nowrap; }
  .kruimels::-webkit-scrollbar { display: none; }
  .kruimels a { color: var(--muted); text-decoration: none; font-size: 0.92rem; padding: 5px 7px; border-radius: 8px; }
  .kruimels a:hover { color: var(--text); background: var(--hover); }
  .kruimels a:last-child { color: var(--accent); font-weight: 600; }
  .kruimels .sep { color: var(--muted); opacity: 0.6; font-size: 0.8rem; }

  /* ---------- Map ---------- */
  .mapkaart { padding: 16px 16px 10px; position: relative; }
  .gereedschap { display: flex; align-items: center; }
  /* kopiëren, knippen, plakken: subtiel rechtsboven zodra je iets selecteert */
  /* gegroepeerde grijze knoppen: klembord en nieuw/uploaden */
  .knopgroep { display: flex; align-items: center; gap: 1px; flex-shrink: 0; padding: 2px; background: var(--field); border: 1px solid var(--line); border-radius: 10px; }
  /* bovenbalk: links waar je bent, rechts vier vaste blokken van even hoog:
     zoeken · bewerken (klembord) · weergave (lijst/tegels, sorteren) · toevoegen (nieuw, uploaden) */
  .gereedschap { gap: 10px; }
  .rij-kruimels { margin-right: 8px; }
  .knopgroep .icoknop.on { background: var(--seg-on); color: var(--text); opacity: 1; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12); }
  .maakgroep .icoknop { opacity: 0.75; }
  .knopgroep .kbsep { width: 1px; align-self: stretch; margin: 5px 3px; background: var(--line); }
  .knopgroep .icoknop { width: 30px; height: 30px; border-radius: 7px; border-color: transparent; background: transparent; color: var(--text); opacity: 0.6; }
  .knopgroep .icoknop.weg:hover:not(:disabled) { color: var(--bad); }
  .knopgroep .icoknop:hover:not(:disabled) { opacity: 1; background: var(--hover); }
  .knopgroep .icoknop:disabled { opacity: 0.22; cursor: default; background: transparent; border-color: transparent; }
  .knopgroep .icoknop svg { width: 18px; height: 18px; }
  /* iets op het klembord: plakken blauw en dikker, zodat het opvalt */
  .knopgroep .icoknop.vol:not(:disabled) { color: var(--accent); opacity: 1; }
  .knopgroep .icoknop.vol svg { stroke-width: 2.5; }
  @media (max-width: 640px) { .maakgroep .alleenbreed { display: none; } }
  @media (max-width: 640px) { .kbknoppen { display: none !important; } }
  .gereedschap.zoekt .kbknoppen { display: none; }
  /* zoeken: vergrootglas dat uitschuift tot zoekbalk */
  .zoek { position: relative; flex-shrink: 0; width: 36px; height: 36px; transition: width 0.22s ease; background: var(--field); border: 1px solid var(--line); border-radius: 10px; }
  .zoek .zoekknop { position: absolute; left: 2px; top: 2px; z-index: 1; width: 30px; height: 30px; border-radius: 7px; color: var(--text); opacity: 0.6; }
  .zoek .zoekknop:hover { opacity: 1; }
  .zoek .zoekdicht { top: 2px !important; right: 2px !important; width: 30px; height: 30px; border-radius: 7px; }
  .zoek input { position: absolute; inset: -1px; width: calc(100% + 2px) !important; height: calc(100% + 2px) !important; width: 100%; height: 100%; padding: 6px 34px 6px 36px; font-size: 15px; opacity: 0; pointer-events: none; transition: opacity 0.15s ease; }
  .zoek .zoekdicht { position: absolute; right: 0; top: 0; opacity: 0; pointer-events: none; }
  .zoek .zoekdicht svg { width: 16px; height: 16px; }
  .zoek.open { width: min(340px, 45%); }
  .zoek input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
  /* terug/vooruit: blauwe pijltjes, iets dikker */

  /* voet */

  /* takenknop: met een ringetje dat de voortgang toont */

  .takenknop { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px 0 5px; border-radius: 999px; border: 1px solid var(--line); background: var(--btn); color: var(--text); font-size: 0.84rem; font-weight: 600; font-variant-numeric: tabular-nums; cursor: pointer; }

  .takenknop[aria-expanded="true"] { border-color: var(--accent); z-index: 71; }   /* boven de donkere achtergrond, bij het paneel */
  .takenknop .tring { position: relative; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: var(--card); }
  .takenknop .tpijl { width: 14px; height: 14px; color: var(--muted); transition: transform 0.15s; }
  .takenknop[aria-expanded="true"] .tpijl { transform: rotate(180deg); }

  .takenknop.actief .ico { animation: takenpuls 2.4s ease-in-out infinite; }
  @keyframes takenpuls { 50% { opacity: 0.55; } }

/* ---------- Opmaak ---------- */
function grootte(b) {
  if (b == null) return '…';
  if (b < 1000) return b + ' B';
  const eenheden = ['kB', 'MB', 'GB', 'TB', 'PB'];
  let v = b, i = -1;
  do { v /= 1000; i++; } while (v >= 1000 && i < eenheden.length - 1);
  return v.toLocaleString('nl-NL', { maximumFractionDigits: v < 10 ? 1 : 0 }) + ' ' + eenheden[i];
}
const MAANDEN = ['jan', 'feb', 'mrt', 'apr', 'mei', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'];
function datum(ms, kort) {
  if (!ms) return '';
  const d = new Date(ms), nu = new Date();
  const tijd = d.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
  const dag = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const vandaag = new Date(nu.getFullYear(), nu.getMonth(), nu.getDate());
  const verschil = Math.round((vandaag - dag) / 864e5);
  if (verschil === 0) return 'vandaag ' + tijd;
  if (verschil === 1) return 'gisteren ' + tijd;
  const tekst = `${d.getDate()} ${MAANDEN[d.getMonth()]}${d.getFullYear() !== nu.getFullYear() || !kort ? ' ' + d.getFullYear() : ''}`;
  return kort ? tekst : tekst + ' ' + tijd;
}
function geledenTekst(ms) {
  const s = Math.max(0, (Date.now() - ms) / 1000);
  if (s < 60) return 'zojuist';
  if (s < 3600) return Math.round(s / 60) + ' min geleden';
  if (s < 86400) return Math.round(s / 3600) + ' uur geleden';
  return datum(ms, true);
}
const meervoud = (n, een, veel) => `${n.toLocaleString('nl-NL')} ${n === 1 ? een : veel}`;

async function api(pad, { methode = 'GET', body, query } = {}) {
  const url = 'api/' + pad + (query ? '?' + new URLSearchParams(query) : '');

  if (methode !== 'GET') { opties.headers['X-FM'] = '1'; opties.headers['Content-Type'] = 'application/json'; }
  if (body !== undefined) opties.body = JSON.stringify(body);
  let r;
  try { r = await fetch(url, opties); } catch { throw new Error('Geen verbinding met de server'); }
  let j = {};
  try { j = await r.json(); } catch {}
  if (r.status === 401 && pad !== 'inloggen') { toonLogin(); throw new Error('Niet ingelogd'); }
  if (r.status === 404 && j.fout === 'Onbekend verzoek') throw new Error('De server van Files web is nog niet bijgewerkt. Vervang server.js en herstart de container files-web.');
  if (!r.ok) throw new Error(j.fout || `Fout ${r.status}`);
  return j;
}

async function klapOm(it) {
  const p = padItem(it);
  if (uitgeklapt.has(p)) {   // inklappen, ook alles wat eronder openstond
    for (const q of [...uitgeklapt]) if (q === p || q.startsWith(p + '/')) uitgeklapt.delete(q);
    return teken();
  }
  uitgeklapt.add(p);
  if (!kinderen.has(p)) {
    kindLaadt.add(p); teken();
    try { await laadKinderen(p); } catch (e) { uitgeklapt.delete(p); toast(e.message); }
    kindLaadt.delete(p);
  }
  teken();
}
// na kopiëren, verwijderen enz.: ook de opengeklapte mappen opnieuw ophalen
async function verversKinderen() {

  const lijst = [...uitgeklapt];
  const res = await Promise.all(lijst.map(p => laadKinderen(p).then(() => true, () => false)));
  lijst.forEach((p, i) => { if (!res[i]) { uitgeklapt.delete(p); kinderen.delete(p); } });

/* ---------- Miniaturen laden: alleen wat in beeld is, en nooit meer dan 3 tegelijk ----------
   Zo blijven er altijd verbindingen vrij voor de rest van de app (bladeren, zoeken, taken),
   ook in een map met duizenden foto's. Wat je voorbij scrolt, wordt niet meer opgehaald. */
const MINI_MAX = 3;
let miniRij = [], miniLopend = 0, miniGen = 0;
const miniObs = 'IntersectionObserver' in window ? new IntersectionObserver(lijst => {
  for (const e of lijst) {
    const img = e.target;
    img._zicht = e.isIntersecting;
    if (e.isIntersecting && !img._gevraagd && !img.getAttribute('src')) { img._gevraagd = true; miniRij.push(img); }
  }
  miniPomp();
}, { rootMargin: '300px 0px' }) : null;
const miniInVlucht = new Map();    // img -> vrijgeven
const miniGeladen = new Set();     // adressen die al eens geladen zijn (staan in de browsercache)
function miniReset() { miniGen++; miniRij = []; miniLopend = 0; miniInVlucht.clear(); if (miniObs) miniObs.disconnect(); if (miniVer) miniVer.disconnect(); }
// rijen die uit de pagina zijn gehaald: hun lopende miniatuur afbreken en de plek vrijgeven
function miniOpruimen() {
  for (const [img, vrij] of [...miniInVlucht]) if (!img.isConnected) { img.removeAttribute('src'); vrij(); }
  miniRij = miniRij.filter(img => img.isConnected);
}
// tegels: miniaturen ver buiten beeld loslaten (de browser kan het geheugen dan vrijgeven); terug in de buurt = direct uit de cache
const miniVer = 'IntersectionObserver' in window ? new IntersectionObserver(lijst => {
  for (const e of lijst) {
    const img = e.target;
    if (!e.isIntersecting && img.getAttribute('src') && miniGeladen.has(img.getAttribute('src'))) { img.dataset.los = img.getAttribute('src'); img.removeAttribute('src'); }
    else if (e.isIntersecting && img.dataset.los) { img.src = img.dataset.los; delete img.dataset.los; }
  }
}, { rootMargin: '2500px 0px' }) : null;
function bereidMiniaturen(el) {
  const tegelsVeel = weergaveModus && weergaveModus.soort === 'tegels';
  el.querySelectorAll('img[data-src]:not([data-klaar])').forEach(img => {
    img.dataset.klaar = '1';
    if (tegelsVeel && miniVer) miniVer.observe(img);
    // al eens geladen: meteen tonen (komt uit de browsercache), zonder wachtrij
    if (miniGeladen.has(img.dataset.src)) { img.src = img.dataset.src; return; }
    if (img.dataset.fallback) img.addEventListener('error', () => {
      const box = img.parentElement; const it = zichtbaar[+box.parentElement.dataset.i];
      box.classList.remove('foto', 'vid'); box.innerHTML = icoonVoor(it || { naam: '' });
    }, { once: true });
    if (miniObs) miniObs.observe(img); else img.src = img.dataset.src;
  });
}
function miniPomp() {
  while (miniLopend < MINI_MAX && miniRij.length) {
    const img = miniRij.shift();
    // inmiddels voorbij gescrold of weg: overslaan (komt hij weer in beeld, dan vraagt hij het opnieuw)
    if (!img.isConnected || !img._zicht) { img._gevraagd = false; continue; }
    miniLopend++;
    const gen = miniGen;
    let klaar = false;
    const vrij = () => { if (klaar) return; klaar = true; clearTimeout(klok); miniInVlucht.delete(img); if (gen === miniGen) { miniLopend--; miniPomp(); } };
    const klok = setTimeout(vrij, 30000);
    miniInVlucht.set(img, vrij);
    img.addEventListener('load', () => { if (miniGeladen.size > 20000) miniGeladen.clear(); miniGeladen.add(img.dataset.src); vrij(); }, { once: true });
    img.addEventListener('error', vrij, { once: true });
    img.src = img.dataset.src;
    if (miniObs) miniObs.unobserve(img);
  }
}
function voetje() {
  const mappen = zichtbaar.filter(i => i.map).length, bestanden = zichtbaar.length - mappen;
  const totaal = zichtbaar.reduce((t, i) => t + (i.grootte || 0), 0);
  const open = zichtbaar.some(i => i.map && i.grootte == null);
  const delen = [];
  if (mappen) delen.push(meervoud(mappen, 'map', 'mappen'));

  $('voetje').textContent = zichtbaar.length ? `${delen.join(', ')} · ${open ? 'minstens ' : ''}${grootte(totaal)}` : '';

function sluitMenu() { document.querySelectorAll('.menu, .menuachter').forEach(m => m.remove()); document.querySelectorAll('.menu-actief').forEach(e => e.classList.remove('menu-actief')); }
function toonMenu(anker, regels, kop) {

  const ctrl = new AbortController();

    const r = await fetch('api/zoek?' + new URLSearchParams(query), { signal: ctrl.signal, credentials: 'same-origin' });
    if (r.status === 401) return toonLogin();

    const lezer = r.body.getReader(), dec = new TextDecoder();

      while ((i = buf.indexOf('\n')) >= 0) {

        if (!regel) continue;

        if (m.voortgang) z.doorzocht = m.voortgang;
        if (m.klaar) Object.assign(z, { klaar: true, doorzocht: m.doorzocht, afgekapt: m.afgekapt, tijdOp: m.tijdOp });

    const regel = (van, naar, klasse = '', uitleg = '') => `<li class="${klasse}"><span class="tmvan">${esc(van)}</span><span class="tmpijl">→</span><span class="tmnaar">${esc(naar)}</span>${uitleg ? `<small>${esc(uitleg)}</small>` : ''}</li>`;
    const goed = vs.stappen.filter(x => !x.probleem);
    let h = '<ul class="tmlijst">';
    if (vs.nieuweMapNaam) h += regel(vs.mapNaam, vs.nieuweMapNaam, 'tmmaprij' + (vs.mapProbleem ? ' tmprob' : ''), vs.mapProbleem || 'map');
    for (const x of vs.stappen) {
      if (x.soort === 'nieuwemap') h += `<li class="tmnieuw"><span class="tmnaar">${esc(x.naar)}</span><small>nieuwe map</small></li>`;
      else if (x.soort === 'leegweg') h += `<li class="tmover"><span class="tmvan">${esc(x.van)}</span><small>wordt daarna leeg en opgeruimd</small></li>`;
      else h += regel(x.van, x.naar, x.probleem ? 'tmprob' : '', x.probleem || (x.soort === 'map' ? 'map' : ''));
    }
    for (const o of vs.overgeslagen) h += `<li class="tmover"><span class="tmvan">${esc(o.naam)}</span><small>${esc(o.reden)}</small></li>`;
    for (const m of vs.restmappen || []) h += `<li class="tmover tmrest"><span class="tmvan">${esc(m.naam)}</span><small>geen video's meer, alleen ${esc(meervoud(m.aantal, 'restbestand', 'restbestanden'))} (${esc(grootte(m.grootte))}). Je krijgt eerst een vraag of deze map weg mag</small></li>`;
    h += '</ul>';
    const n = goed.filter(x => x.soort === 'bestand').length;
    const iets = goed.length || (vs.nieuweMapNaam && !vs.mapProbleem);
    const rest = (vs.restmappen || []).length;
    $('tmVoor').innerHTML = `<p class="tmkop">${iets ? `${vs.nieuweMapNaam && !vs.mapProbleem ? 'De map' + (n ? ' en ' : '') : ''}${n ? meervoud(n, 'bestand', 'bestanden') : ''} ${n + (vs.nieuweMapNaam && !vs.mapProbleem ? 1 : 0) === 1 ? 'krijgt' : 'krijgen'} een nieuwe naam${rest ? `, daarna ${rest === 1 ? 'een restmap' : rest + ' restmappen'} opruimen (met vraag)` : ''}` : rest ? 'Alles heeft al de juiste naam, er zijn alleen restmappen om op te ruimen' : 'Alles heeft al de juiste naam'}</p>` + h;
    $('tmToepassen').disabled = !(iets || rest);
  };
  // knoppen
  $('tmSoort').addEventListener('click', e => { const b = e.target.closest('[data-s]'); if (b && b.dataset.s !== st.soort) { zetSoort(b.dataset.s); zoek(); } });
  $('tmZoek').addEventListener('click', zoek);
  ['tmTerm', 'tmJaar'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); zoek(); } }));
  $('tmRes').addEventListener('click', e => { const b = e.target.closest('.tmrij'); if (b) kies(st.resultaten[+b.dataset.i]); });
  $('tmToepassen').addEventListener('click', async () => {
    if (!st.gekozen || !st.voorstel) return;
    const b = $('tmToepassen'); b.disabled = true; b.textContent = 'Bezig…';
    try {
      const r = await api('tmdb/toepassen', { methode: 'POST', body: { pad, soort: st.gekozen.soort, id: st.gekozen.id } });
      if (vensterSluit) vensterSluit('ok');
      const rest = st.voorstel.restmappen || [];
      if (r.gedaan || r.mapHernoemd || r.fouten.length || !rest.length) {
      const wat = [r.mapHernoemd ? 'map' : '', r.gedaan ? meervoud(r.gedaan, 'bestand', 'bestanden') : ''].filter(Boolean).join(' en ');
      toast(`${wat ? wat.charAt(0).toUpperCase() + wat.slice(1) + ' hernoemd' : 'Niets hernoemd'}${r.fouten.length ? ` (${meervoud(r.fouten.length, 'melding', 'meldingen')})` : ''}`, 'Ongedaan maken', async () => {
        try { const t = await api('tmdb/terug', { methode: 'POST', body: { id: r.id } }); toast(t.fouten.length ? `Teruggezet, met ${meervoud(t.fouten.length, 'melding', 'meldingen')}` : 'Teruggezet'); laadMap({ stil: true }); laadFavorieten(); }
        catch (e) { toast(e.message); }
      }, 10000);
      if (r.fouten.length) setTimeout(() => toast(r.fouten.slice(0, 4).join('\n') + (r.fouten.length > 4 ? `\nen nog ${r.fouten.length - 4}` : ''), null, null, 9000), 300);
      }
      if (r.mapHernoemd) { laadFavorieten(); markeerNa = r.map.split('/').pop(); }
      await laadMap({ stil: true });
      if (rest.length) setTimeout(() => ruimRestOp(r.map, rest), r.gedaan || r.mapHernoemd ? 600 : 0);
    } catch (e) { b.disabled = false; b.textContent = 'Toepassen'; melding(e.message, 'bad'); }
  });
  // beginnen: raden wat het is en meteen zoeken
  zetSoort('film');
  try {
    const r = await api('tmdb/start', { query: { pad } });
    $('tmTerm').value = r.term || ''; $('tmJaar').value = r.jaar || ''; zetSoort(r.soort);
    st.resultaten = r.resultaten || [];
    toonResultaten();
    if (st.resultaten[0]) kies(st.resultaten[0]);
    else melding(r.term ? 'Geen match gevonden. Zoek zelf hierboven.' : 'Typ de titel hierboven.', 'warn');
  } catch (e) { $('tmRes').innerHTML = ''; melding(e.message, 'bad'); }
}

/* ---------- Nederlandse ondertitels (OpenSubtitles.com) ---------- */
let osAan = false;
const OS_VIDEO = new Set(['mkv', 'mp4', 'avi', 'm4v', 'mov', 'wmv', 'ts', 'm2ts', 'mpg', 'mpeg', 'webm']);
async function osVenster(it) {
  const pad = padItem(it);
  const st = { id: null, items: [], klaar: false, over: null, stop: false, kiezen: new Map() };   // video -> file id (of 0 = niet)
  const venst = venster(`<div class="tmdb">
    <h3>Zoek ondertitels</h3>
    <p class="hint tmmap">${(it.map ? IC.map : IC.video).replace(/^<svg /, '<svg width="16" height="16" ')}<span>${esc(it.naam)}</span></p>
    <div class="osstand" id="osStand"><span id="osTekst">Zoeken…</span><span class="osbalk"><i id="osBalk"></i></span></div>
    <div class="msg" id="osMsg"></div>
    <label class="osalles" id="osAllesRij" hidden><input type="checkbox" id="osAlles" checked> Alles kiezen</label>
    <ul class="oslijst" id="osLijst" hidden></ul>
    <div class="osvoet"><span class="ostegoed" id="osTegoed"></span>
      <div class="knoppen"><button type="button" data-w="nee">Annuleren</button><button type="button" class="primary" id="osDown" disabled>Downloaden</button></div></div>
    <p class="tmbron">Ondertitels van OpenSubtitles.com. Alleen Nederlands.</p>
  </div>`);
  $('doos').classList.add('breed');
  venst.then(() => { $('doos').classList.remove('breed'); st.stop = true; if (st.id && !st.klaar) api('os/stop', { methode: 'POST', body: { id: st.id } }).catch(() => {}); });
  const melding = (t, soort) => bericht($('osMsg'), t || '', soort);
  const optie = k => `${k.hash ? '✓ Past precies · ' : ''}${k.release || 'Ondertitel'} · ${k.downloads.toLocaleString('nl-NL')}×${k.doven ? ' · doven/slechthorenden' : ''}${k.machine ? ' · machinevertaling' : ''}`;
  const handDeel = (x, i) => {
    if (!st.klaar) return '';
    if (!x.hand) return `<button type="button" class="oshand" data-hand="${i}">Zelf zoeken…</button>`;
    const w = x.wat || {}, h = x.hand;
    return `<form class="osform" data-form="${i}">
      <input class="ost" type="text" value="${esc(h.term ?? w.term ?? '')}" placeholder="Titel, of IMDb-/TMDB-link" aria-label="Titel" autocomplete="off" spellcheck="false">
      <input class="osk" type="text" value="${esc(h.jaar ?? w.jaar ?? '')}" placeholder="Jaar" inputmode="numeric" maxlength="4" aria-label="Jaar" autocomplete="off">
      <label>S <input class="osse oss" type="text" value="${esc(h.s ?? (w.s ?? ''))}" inputmode="numeric" maxlength="2" aria-label="Seizoen" autocomplete="off"></label>
      <label>E <input class="osse ose" type="text" value="${esc(h.e ?? (w.e ?? ''))}" inputmode="numeric" maxlength="3" aria-label="Aflevering" autocomplete="off"></label>
      <button type="submit" class="small primary"${h.bezig ? ' disabled' : ''}>${h.bezig ? 'Zoeken…' : 'Zoeken'}</button>
      <button type="button" class="small" data-handweg="${i}">Sluiten</button>
      <span class="osfmsg">${esc(h.melding || '')}</span></form>`;
  };
  const rij = (x, i) => {
    const map = x.video.includes('/') ? x.video.split('/').slice(0, -1).join('/') : '';
    const kop = `<span class="osnaam">${esc(x.naam)}${map ? `<small>${esc(map)}</small>` : ''}</span>`;
    if (x.al) return `<li class="uit"><span></span>${kop}<span class="osgeen">Heeft al een Nederlandse ondertitel</span></li>`;
    if (!x.kandidaten.length) return `<li class="uit" data-r="${i}"><span></span>${kop}<span class="osgeen${x.fout ? ' fout' : ''}">${esc(x.fout || 'Geen Nederlandse ondertitel gevonden')}</span>${handDeel(x, i)}</li>`;
    const gekozen = st.kiezen.get(x.video);
    return `<li data-i="${i}" data-r="${i}"><input type="checkbox" ${gekozen ? 'checked' : ''} aria-label="Kiezen">${kop}
      <select aria-label="Ondertitel">${x.kandidaten.map(k => `<option value="${k.id}"${k.id === (gekozen || x.kandidaten[0].id) ? ' selected' : ''}>${esc(optie(k))}</option>`).join('')}</select>${handDeel(x, i)}</li>`;
  };
  const samenvatting = () => {
    const met = st.items.filter(x => x.kandidaten.length && !x.al).length, al = st.items.filter(x => x.al).length;
    $('osTekst').textContent = met ? `Voor ${met} van ${meervoud(st.items.length, 'video', 'video\'s')} een Nederlandse ondertitel gevonden${al ? `, ${al} had${al === 1 ? '' : 'den'} er al een` : ''}`
      : al === st.items.length ? 'Alle video\'s hebben al een Nederlandse ondertitel' : 'Geen Nederlandse ondertitels gevonden';
  };
  // één rij opnieuw tekenen (de rest van de lijst en wat je daar typt blijft staan)
  const tekenRij = i => { const oud = $('osLijst').querySelector(`li[data-r="${i}"]`); if (!oud) return toon(); oud.outerHTML = rij(st.items[i], i); werkVoetBij(); };
  $('osLijst').addEventListener('click', e => {
    const b = e.target.closest('[data-hand]');
    if (b) { const i = +b.dataset.hand; st.items[i].hand = {}; tekenRij(i); const f = $('osLijst').querySelector(`form[data-form="${i}"] .ost`); if (f) { f.focus(); f.select(); } return; }
    const w = e.target.closest('[data-handweg]');
    if (w) { const i = +w.dataset.handweg; st.items[i].hand = null; tekenRij(i); }
  });
  $('osLijst').addEventListener('submit', async e => {
    e.preventDefault();
    const f = e.target.closest('form[data-form]'); if (!f) return;
    const i = +f.dataset.form, x = st.items[i];
    const h = x.hand = { term: f.querySelector('.ost').value.trim(), jaar: f.querySelector('.osk').value.trim(), s: f.querySelector('.oss').value.trim(), e: f.querySelector('.ose').value.trim(), bezig: true };
    tekenRij(i);
    try {
      const r = await api('os/handzoek', { methode: 'POST', body: { pad: st.basis, video: x.video, term: h.term, jaar: h.jaar, s: h.s, e: h.e } });
      if (!$('osLijst')) return;
      if (r.over != null) st.over = r.over;
      h.bezig = false;
      if (r.kandidaten.length) { x.kandidaten = r.kandidaten; x.fout = null; x.hand = null; st.kiezen.set(x.video, r.kandidaten[0].id); samenvatting(); }
      else h.melding = 'Ook zo geen Nederlandse ondertitel gevonden. Probeer een andere schrijfwijze, of plak de IMDb-link.';
    } catch (err) { h.bezig = false; h.melding = err.message; }
    if ($('osLijst')) tekenRij(i);
  });
  const gekozenLijst = () => st.items.filter(x => st.kiezen.get(x.video)).map(x => ({ video: x.video, id: st.kiezen.get(x.video) }));
  const werkVoetBij = () => {
    const n = gekozenLijst().length;
    const b = $('osDown'); if (!b) return;
    b.disabled = !n; b.textContent = n ? `Downloaden (${n})` : 'Downloaden';
    const t = $('osTegoed');
    if (st.over != null) { t.textContent = `Vandaag nog ${meervoud(st.over, 'download', 'downloads')} over`; t.classList.toggle('warn', n > st.over); if (n > st.over) t.textContent += `, je kiest er ${n}`; }
    const keuzeRijen = st.items.filter(x => x.kandidaten.length && !x.al);
    $('osAllesRij').hidden = keuzeRijen.length < 2;
    $('osAlles').checked = keuzeRijen.every(x => st.kiezen.get(x.video));
  };
  const toon = () => {
    const l = $('osLijst');
    // video's met een keuze eerst, daarna de rest (geen gevonden, al aanwezig)
    const volg = st.items.map((x, i) => [x, i]).sort((a, b) => (!a[0].kandidaten.length || a[0].al) - (!b[0].kandidaten.length || b[0].al));
    l.innerHTML = volg.map(([x, i]) => rij(x, i)).join('');
    l.hidden = !st.items.length;
    werkVoetBij();
  };
  $('osLijst').addEventListener('change', e => {
    const li = e.target.closest('li[data-i]'); if (!li) return;
    const x = st.items[+li.dataset.i];
    const sel = li.querySelector('select'), cb = li.querySelector('input');
    if (e.target === sel) cb.checked = true;
    st.kiezen.set(x.video, cb.checked ? Number(sel.value) : 0);
    werkVoetBij();
  });
  $('osAlles').addEventListener('change', e => {
    const aan = e.target.checked;
    $('osLijst').querySelectorAll('li[data-i]').forEach(li => { const x = st.items[+li.dataset.i]; li.querySelector('input').checked = aan; st.kiezen.set(x.video, aan ? Number(li.querySelector('select').value) : 0); });
    werkVoetBij();
  });
  $('osDown').addEventListener('click', async () => {
    const keuzes = gekozenLijst(); if (!keuzes.length) return;
    const b = $('osDown'); b.disabled = true; b.textContent = 'Downloaden…';
    try {
      const r = await api('os/download', { methode: 'POST', body: { pad: st.basis, keuzes } });
      if (vensterSluit) vensterSluit('ok');
      await laadMap({ stil: true });
      const rest = r.over != null ? ` · nog ${r.over} over vandaag` : '';
      if (r.gedaan.length) {
        const paden = r.gedaan.map(x => st.basis + '/' + x);
        toast(`${meervoud(r.gedaan.length, 'ondertitel', 'ondertitels')} gedownload${rest}`, 'Ongedaan maken', async () => {
          try { await api('verwijder', { methode: 'POST', body: { paden } }); laadMap({ stil: true }); laadBakAantal(); toast('Ondertitels naar de prullenbak'); } catch (e) { toast(e.message); }
        }, 10000);
      } else if (!r.fouten.length) toast('Niets gedownload');
      if (r.fouten.length) setTimeout(() => toast(r.fouten.slice(0, 4).join('\n') + (r.fouten.length > 4 ? `\nen nog ${r.fouten.length - 4}` : ''), null, null, 9000), r.gedaan.length ? 300 : 0);
    } catch (e) { b.disabled = false; werkVoetBij(); melding(e.message, 'bad'); }
  });
  // zoeken starten en de voortgang ophalen
  try {
    const s0 = await api('os/status');
    st.over = s0.over;
    if (!s0.account) $('osTegoed').textContent = 'Zonder account: 5 downloads per dag';
    const r = await api('os/zoek', { methode: 'POST', body: { pad } });
    st.id = r.id;
    st.basis = it.map ? pad : pad.split('/').slice(0, -1).join('/');
    if (!r.totaal) { $('osStand').classList.add('klaar'); $('osTekst').textContent = 'Geen video\'s gevonden in deze map'; st.klaar = true; return; }
    let missers = 0;
    while (!st.stop) {
      let v;
      // een haperende verbinding mag het zoeken niet afbreken: een paar keer opnieuw proberen
      try { v = await api('os/voortgang', { query: { id: st.id, vanaf: st.items.length } }); missers = 0; }
      catch (e) { if (++missers > 5 || /bestaat niet meer/.test(e.message)) throw e; await new Promise(x => setTimeout(x, 1500)); continue; }
      if (st.stop || !$('osLijst')) return;
      for (const x of v.items) { st.items.push(x); if (x.kandidaten.length && !x.al) st.kiezen.set(x.video, x.kandidaten[0].id); }
      if (v.over != null) st.over = v.over;
      $('osBalk').style.width = Math.round(v.gedaan / Math.max(1, v.totaal) * 100) + '%';
      $('osTekst').textContent = v.klaar ? '' : `Zoeken… ${v.gedaan} van ${v.totaal}`;
      if (v.items.length) toon(); else werkVoetBij();
      if (v.klaar) {
        st.klaar = true; $('osStand').classList.add('klaar'); toon();
        samenvatting();
        if (v.meer) melding(`Er zijn nog ${v.meer} video's meer. Kies een kleinere map om die ook te doen.`, 'warn');
        if (v.fout) melding(v.fout, 'bad'); else if (v.waarschuwing) melding(v.waarschuwing, 'warn');
        return;
      }
      await new Promise(x => setTimeout(x, 700));
    }
  } catch (e) { $('osStand').classList.add('klaar'); $('osTekst').textContent = ''; melding(e.message, 'bad'); }
}

// mappen die na het hernoemen alleen nog restbestanden bevatten: na toestemming naar de prullenbak
async function ruimRestOp(map, rest) {
  const totaal = rest.reduce((t, m) => t + m.grootte, 0);
  const lijst = rest.slice(0, 6).map(m => `• ${m.naam}${m.voorbeeld.length ? ` (${m.voorbeeld.slice(0, 3).join(', ')}${m.aantal > 3 ? ', …' : ''})` : ' (leeg)'}`).join('\n') + (rest.length > 6 ? `\n• en nog ${rest.length - 6}` : '');
  const tekst = `${rest.length === 1 ? 'Deze map bevat' : `Deze ${rest.length} mappen bevatten`} geen video's meer, alleen restbestanden (samen ${grootte(totaal)}):\n\n${lijst}\n\n${rest.length === 1 ? 'Hij gaat' : 'Ze gaan'} naar de prullenbak, dus je kunt ${rest.length === 1 ? 'hem' : 'ze'} altijd terugzetten.`;
  if (!await vraag(rest.length === 1 ? 'Restmap opruimen?' : 'Restmappen opruimen?', tekst, 'Opruimen')) return;
  try {
    const r = await api('tmdb/opruimen', { methode: 'POST', body: { pad: map, mappen: rest.map(m => m.naam) } });
    await laadMap({ stil: true }); laadBakAantal();
    if (r.fouten.length) setTimeout(() => toast(r.fouten.slice(0, 4).join('\n'), null, null, 9000), r.gelukt ? 300 : 0);
    if (r.gelukt) toast(`${meervoud(r.gelukt, 'map', 'mappen')} naar de prullenbak`, 'Ongedaan maken', async () => {
      try { await api('prullenbak/terug', { methode: 'POST', body: { ids: r.ids } }); laadMap({ stil: true }); laadBakAantal(); toast('Teruggezet'); }
      catch (e) { toast(e.message); }
    }, 10000);
  } catch (e) { toast(e.message); }
}

async function vraagBeleid(conflicten, wat) {
  const lijst = conflicten.slice(0, 5).map(c => '• ' + c.split('/').pop()).join('\n') + (conflicten.length > 5 ? `\n• en nog ${conflicten.length - 5}` : '');
  return venster(`<h3>${conflicten.length === 1 ? 'Bestaat al' : meervoud(conflicten.length, 'item bestaat', 'items bestaan') + ' al'}</h3>
    <p>${esc(lijst)}\n\nWat wil je doen met ${conflicten.length === 1 ? 'dit item' : 'deze items'} ${esc(wat)}?</p>
    <div class="knoppen stapel">
      <button data-w="beide" class="primary">Beide behouden</button>
      <button data-w="vervang">Vervangen <span class="hint">(oude naar prullenbak)</span></button>
      <button data-w="overslaan">Overslaan</button>
      <button data-w="nee">Annuleren</button>
    </div>`, { focus: '[data-w="beide"]' }).then(w => w === 'nee' ? null : w);
}
async function plak() {
  if (!klembord || !huidigPad || huidigPad === '#bak') return;
  const { modus, paden, map } = klembord;
  const doel = huidigPad;
  if (modus === 'knip' && map === doel) { toast('Deze items staan al in deze map'); return; }
  if (paden.some(p => doel === p || doel.startsWith(p + '/'))) { toast('Een map kan niet in zichzelf geplakt worden'); return; }
  let beleid = 'beide';
  if (map !== doel) {
    try {
      const { conflicten } = await api('conflicten', { methode: 'POST', body: { doel, namen: paden.map(p => p.split('/').pop()) } });
      if (conflicten.length) { beleid = await vraagBeleid(conflicten, 'hier'); if (!beleid) return; }
    } catch (e) { return toast(e.message); }
  }
  try {
    const r = await api('taak', { methode: 'POST', body: { bronnen: paden, doel, verplaatsen: modus === 'knip', beleid } });
    // loopt het nog: het takenoverzicht openen met de voortgang (al klaar: melding met "Bekijken")
    if (!r.taak || ['wacht', 'bezig'].includes(r.taak.status)) openTaken();
    // knippen: klembord leeg; kopiëren: blijft beschikbaar voor nog een keer plakken, maar niet meer blauw
    if (modus === 'knip') klembord = null; else klembord.geplakt = true;
    opslagSchrijf('fm_klembord', klembord);
    updatePlakbalk();
    volgTaken();
  } catch (e) { toast(e.message); }
}

/* ---------- Taken (kopiëren, verplaatsen, uploaden) ---------- */
const getoond = new Set(opslagLees('fm_taken_gezien', []));   // afgeronde taken die je uit de lijst hebt gehaald (per apparaat)
const paginaStart = Date.now();
let takenKlok = null, serverTaken = [], klokVerschil = 0, eersteKeer = true;
const uploads = [];
// taken draaien op de server: ze lopen door als je ververst, en je ziet ze ook op een ander apparaat
async function volgTaken() {
  clearTimeout(takenKlok);
  try { const r = await api('taken'); serverTaken = r.taken; if (r.nu) klokVerschil = r.nu - Date.now(); } catch { serverTaken = serverTaken || []; }

/* ---------- Tekstverwerker (json, yaml, conf, txt …) ----------

   Is het bestand intussen ergens anders gewijzigd, dan wordt er niet overschreven. */
const TEKST_EXT = new Set(['txt', 'md', 'markdown', 'json', 'jsonc', 'json5', 'yaml', 'yml', 'conf', 'cfg', 'cnf', 'ini', 'env', 'toml', 'xml', 'html', 'htm', 'css', 'scss', 'js', 'mjs', 'cjs', 'ts', 'sh', 'bash', 'zsh', 'py', 'php', 'rb', 'go', 'rs', 'java', 'c', 'h', 'cpp', 'lua', 'sql', 'log', 'csv', 'tsv', 'nfo', 'srt', 'vtt', 'ass', 'ssa', 'properties', 'service', 'timer', 'list', 'rules', 'htaccess', 'gitignore', 'dockerignore', 'editorconfig', 'lock', 'tf', 'hcl', 'nginx', 'caddyfile']);
const TEKST_NAAM = /^(dockerfile|makefile|readme|license|licence|changelog|hosts|crontab|caddyfile|vagrantfile|procfile)$/i;
const isTekst = it => !it.map && (TEKST_EXT.has(ext(it.naam)) || TEKST_NAAM.test(it.naam) || (it.naam.startsWith('.') && !it.naam.slice(1).includes('.') && it.naam.length > 1));

function edKop() {

  $('edInfo').classList.toggle('vuil', vuil);

}
function edRegelnummers() {
  const n = edTa.value.split('\n').length;

  $('edRegels').scrollTop = edTa.scrollTop;
}
function edPlek() {
  const v = edTa.value, p = edTa.selectionStart;

// controle: JSON moet kloppen; YAML mag niet inspringen met tabs
function edControle() {

  m.className = ''; m.textContent = '';

    if (!v.trim()) return true;
    try { JSON.parse(v); m.className = 'ok'; m.textContent = 'JSON klopt'; return true; }
    catch (e) {
      let uitleg = e.message;
      const pos = /position (\d+)/.exec(e.message), lk = /line (\d+) column (\d+)/.exec(e.message);
      if (lk) uitleg = `regel ${lk[1]}, kolom ${lk[2]}`;
      else if (pos) { const voor = v.slice(0, +pos[1]); uitleg = `regel ${voor.split('\n').length}, kolom ${+pos[1] - voor.lastIndexOf('\n')}`; }
      m.className = 'bad'; m.textContent = `JSON klopt niet (${uitleg})`; return false;
    }

  if (ed.soort === 'yaml' || ed.soort === 'yml') {
    const r = v.split('\n').findIndex(l => /^ *\t/.test(l));

$('editor').addEventListener('keydown', e => {
  const cmd = e.metaKey || e.ctrlKey;

  if (e.key === 'Escape') { e.preventDefault(); sluitEditor(); return; }

async function toonEigenschappen(g) {
  if (g.length > 1) {
    const som = g.reduce((t, i) => t + (i.grootte || 0), 0);
    const open = g.some(i => i.grootte == null);
    const bestanden = g.reduce((t, i) => t + (i.map ? (i.inhoud ? i.inhoud.bestanden : 0) : 1), 0);

      <dl><dt>Locatie</dt><dd>${esc(huidigPad)}</dd>
      <dt>Grootte</dt><dd>${open ? 'minstens ' : ''}${grootte(som)} <small>(${som.toLocaleString('nl-NL')} bytes)</small></dd>
      <dt>Inhoud</dt><dd>${meervoud(bestanden, 'bestand', 'bestanden')}${open ? ' (nog niet alles berekend)' : ''}</dd></dl></div>
      <div class="knoppen"><button data-w="nee" class="primary">Sluiten</button></div>`);
  }
  const it = g[0], pad = padItem(it);
  let gesloten = false;
  const tekenEig = e => {
    const foto = e.foto;
    const ico = heeftMini(e) ? `<div class="ico"><img src="${esc(miniUrl(pad))}" alt="" onerror="this.remove()"></div>` : `<div class="ico">${icoonVoor(e)}</div>`;
    const rijen = [
      ['Locatie', esc(pad.split('/').slice(0, -1).join('/'))],
      ['Grootte', e.grootte == null ? 'berekenen…' : `${grootte(e.grootte)} <small>(${e.grootte.toLocaleString('nl-NL')} bytes)</small>`],
      e.map ? ['Inhoud', e.bestanden == null ? 'berekenen…' : `${meervoud(e.bestanden, 'bestand', 'bestanden')}, ${meervoud(e.mappen, 'map', 'mappen')}`] : ['Type', esc((ext(e.naam) || 'bestand').toUpperCase())],
      ['Gewijzigd', esc(datum(e.gewijzigd))],
      e.aangemaakt ? ['Aangemaakt', esc(datum(e.aangemaakt))] : null,
      e.link ? ['Verwijst naar', esc(e.link)] : null,
      ['Rechten', `${esc(e.rechten)} <small>· eigenaar ${esc(e.eigenaar)}</small>`],
    ].filter(Boolean);
    if (foto) {
      const inst = [foto.diafragma, foto.sluiter, foto.iso ? 'ISO ' + foto.iso : null, foto.brandpunt].filter(Boolean).join(' · ');
      rijen.push(['__sectie', 'Foto']);
      if (foto.camera) rijen.push(['Camera', esc(foto.camera)]);
      if (foto.lens) rijen.push(['Lens', esc(foto.lens)]);
      if (inst) rijen.push(['Instellingen', esc(inst)]);
      if (foto.afmeting) rijen.push(['Afmeting', esc(foto.afmeting) + ' px']);
      if (foto.genomen) rijen.push(['Genomen', esc(foto.genomen)]);
    }
    return `<div class="eig"><div class="ekop">${ico}<h3>${esc(e.naam)}</h3></div><dl>${rijen.map(([k, v]) => k === '__sectie' ? `<div class="sectie">${v}</div>` : `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl></div>
      <div class="knoppen"><button data-w="nee" class="primary">Sluiten</button></div>`;
  };
  let e;
  try { e = await api('eigenschappen', { query: { pad } }); } catch (err) { return toast(err.message); }

        $('doos').querySelectorAll('[data-w]').forEach(b => b.addEventListener('click', () => vensterSluit && vensterSluit(b.dataset.w)));
        const ii = items.find(i => i.naam === it.naam); if (ii) { ii.grootte = e.grootte; ii.inhoud = { bestanden: e.bestanden, mappen: e.mappen }; werkGroottesBij(); }
      }
    } catch { break; }
  }
  return klaar;
}

$('viewer').addEventListener('click', e => { if (e.target === $('viewer')) sluitViewer(); });
window.addEventListener('popstate', () => { if (viewer.open) sluitViewer(true); if (speler.open) sluitSpeler(true); if (ed.open) sluitEditor(true); });

/* ---------- Videospeler: venster met eigen bediening ---------- */
const SPEELBAAR = new Set(['mp4', 'm4v', 'mov', 'webm', 'mkv', 'mp3', 'm4a', 'aac', 'wav', 'flac', 'ogg', 'opus']);
const speler = { open: false, pad: null, slepen: false };
const tijd = t => { if (!isFinite(t) || t < 0) t = 0; const u = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, sec = Math.floor(t % 60); return (u ? u + ':' + String(m).padStart(2, '0') : m) + ':' + String(sec).padStart(2, '0'); };
const PLAY = '<path d="M8 5.5v13l11-6.5z"/>', PAUZE = '<rect x="6.5" y="5" width="4" height="14" rx="1"/><rect x="13.5" y="5" width="4" height="14" rx="1"/>';
function openSpeler(it) {

  const v = $('sVideo');
  v.hidden = false;
  v.onerror = () => {
    if (!speler.open) return;

    const e = ext(it.naam);
    $('sMelding').hidden = false;
    $('sMelding').innerHTML = `<div>Deze video kan je browser niet afspelen.<br><span style="opacity:.75">${e === 'mkv' ? 'MKV-bestanden werken vaak niet in Safari, en geluid in AC3 of DTS ook vaak niet.' : 'Het formaat of de codec wordt niet ondersteund.'} Download hem en open hem bijvoorbeeld in VLC.</span></div><button id="sMeldingDl">Downloaden</button>`;
    $('sMeldingDl').onclick = () => $('sDownload').click();
  };
  if (videoMini) v.poster = miniUrl(pad, 'groot'); else v.removeAttribute('poster');
  v.src = bestandUrl(pad);
  $('speler').classList.add('open');
  $('speler').classList.remove('speelt');
  document.body.style.overflow = 'hidden';
  history.pushState({ speler: true }, '');
  v.play().catch(() => {});      // lukt niet altijd zonder klik (bijv. Safari): dan staat de grote afspeelknop klaar
}
function sluitSpeler(vanGeschiedenis) {
  if (!speler.open) return;
  speler.open = false;
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  const v = $('sVideo');
  v.pause(); v.removeAttribute('src'); v.load();
  $('speler').classList.remove('open', 'speelt');
  document.body.style.overflow = '';
  if (!vanGeschiedenis && history.state && history.state.speler) history.back();
}
function speelPauze() { const v = $('sVideo'); if (v.paused || v.ended) v.play().catch(() => {}); else v.pause(); }
(() => {
  const v = $('sVideo');
  const bijwerken = () => {
    const d = v.duration;
    $('sDuur').textContent = tijd(d);
    if (!speler.slepen) {
      $('sNu').textContent = tijd(v.currentTime);
      const deel = d ? v.currentTime / d : 0;
      $('sTijdlijn').value = Math.round(deel * 1000);
      $('sTijdlijn').style.setProperty('--deel', (deel * 100).toFixed(2) + '%');
    }
  };
  v.addEventListener('timeupdate', bijwerken);
  v.addEventListener('durationchange', bijwerken);
  v.addEventListener('loadedmetadata', () => {
    bijwerken(); $('sLaden').hidden = true; $('sGeluid').hidden = v.videoWidth > 0;
    // venster aanpassen aan de vorm van de video (staand, 4:3, 16:9 ...), maar nooit hoger dan het scherm
    // het venster wordt zo breed dat de video (4:3, 16:9, 21:9, staand) precies past: geen zwarte balken links en rechts
    const vw = v.videoWidth, vh = v.videoHeight;
    $('sBeeld').style.aspectRatio = vw && vh ? `${vw} / ${vh}` : '';
    $('spelerdoos').style.maxWidth = vw && vh ? `min(980px, calc((100vh - 170px) * ${(vw / vh).toFixed(4)}))` : '';
  });
  v.addEventListener('waiting', () => { $('sLaden').hidden = false; });
  v.addEventListener('playing', () => { $('sLaden').hidden = true; });
  v.addEventListener('canplay', () => { $('sLaden').hidden = true; });
  const stand = () => { const p = !v.paused && !v.ended; $('speler').classList.toggle('speelt', p); $('sPlayIco').innerHTML = p ? PAUZE : PLAY; $('sPlay').title = p ? 'Pauze (spatie)' : 'Afspelen (spatie)'; };
  v.addEventListener('play', stand); v.addEventListener('pause', stand); v.addEventListener('ended', stand);
  v.addEventListener('click', speelPauze);
  v.addEventListener('dblclick', () => $('sVol').click());
  $('sPlay').addEventListener('click', speelPauze);
  $('sGrootPlay').addEventListener('click', speelPauze);
  const tl = $('sTijdlijn');
  tl.addEventListener('input', () => {
    speler.slepen = true;
    const t = (tl.value / 1000) * (v.duration || 0);

  });
  tl.addEventListener('change', () => { if (v.duration) v.currentTime = (tl.value / 1000) * v.duration; speler.slepen = false; });
  const geluid = () => { $('speler').classList.toggle('stil', v.muted || v.volume === 0); $('sVolume').value = v.muted ? 0 : v.volume; };
  v.addEventListener('volumechange', geluid);
  $('sMute').addEventListener('click', () => { v.muted = !v.muted; if (!v.muted && v.volume === 0) v.volume = 0.6; });

  $('sVol').addEventListener('click', () => {
    const doos = $('spelerdoos');
    if (document.fullscreenElement) return document.exitFullscreen().catch(() => {});
    if (doos.requestFullscreen) doos.requestFullscreen().catch(() => { if (v.webkitEnterFullscreen) v.webkitEnterFullscreen(); });
    else if (v.webkitEnterFullscreen) v.webkitEnterFullscreen();     // iPhone
  });
  $('speler').addEventListener('click', e => { if (e.target === $('speler')) sluitSpeler(); });
})();
$('sSluit').addEventListener('click', () => sluitSpeler());
$('sDownload').addEventListener('click', () => { const a = document.createElement('a'); a.href = bestandUrl(speler.pad, true); a.download = ''; document.body.append(a); a.click(); a.remove(); });
function fotoBron(it, poging) {
  const e = ext(it.naam), pad = it.pad;
  const direct = BROWSER_FOTO.has(e) && (e === 'gif' || (it.grootte || 0) < 6e6);
  if (poging === 0) return direct ? bestandUrl(pad) : miniUrl(pad, 'groot');
  if (poging === 1 && !direct && BROWSER_FOTO.has(e)) return bestandUrl(pad);
  return null;
}
function toonFoto() {
  const it = viewer.lijst[viewer.i];
  if (!it) return sluitViewer();
  zetZoom(1, 0, 0);
  $('vNaam').textContent = it.naam;
  $('vTeller').textContent = `${viewer.i + 1} van ${viewer.lijst.length}${it.grootte ? ' · ' + grootte(it.grootte) : ''}`;
  $('vVorige').style.visibility = viewer.i > 0 ? '' : 'hidden';
  $('vVolgende').style.visibility = viewer.i < viewer.lijst.length - 1 ? '' : 'hidden';
  const img = $('vFoto');
  $('vMelding').hidden = true; $('vLaden').hidden = false;
  img.style.visibility = 'hidden';
  let poging = 0;
  const huidig = viewer.i;
  img.onload = () => { if (huidig !== viewer.i) return; $('vLaden').hidden = true; img.style.visibility = ''; };
  img.onerror = () => {
    if (huidig !== viewer.i) return;
    const volgende = fotoBron(it, ++poging);
    if (volgende) { img.src = volgende; return; }
    $('vLaden').hidden = true;
    $('vMelding').hidden = false;
    $('vMelding').textContent = 'Van deze foto kan geen voorbeeld worden getoond. Je kunt hem wel downloaden.';
  };
  img.src = fotoBron(it, 0);
  // buren alvast laden
  [viewer.i - 1, viewer.i + 1].forEach(j => { const b = viewer.lijst[j]; if (b) { const p = new Image(); p.src = fotoBron(b, 0); } });
}
function naarFoto(stap) {
  const n = viewer.i + stap;
  if (n < 0 || n >= viewer.lijst.length) return;
  viewer.i = n; toonFoto();
}
$('vSluit').addEventListener('click', () => sluitViewer());
$('vVorige').addEventListener('click', () => naarFoto(-1));
$('vVolgende').addEventListener('click', () => naarFoto(1));
$('vDownload').addEventListener('click', () => { const it = viewer.lijst[viewer.i]; const a = document.createElement('a'); a.href = bestandUrl(it.pad, true); a.download = ''; document.body.append(a); a.click(); a.remove(); });
$('vInfo').addEventListener('click', () => toonEigenschappen([viewer.lijst[viewer.i]]));

// zoomen, slepen en vegen
function zetZoom(z, x, y) {
  viewer.z = z; viewer.x = x; viewer.y = y;
  const img = $('vFoto');
  if (z <= 1.001) { viewer.z = 1; viewer.x = 0; viewer.y = 0; }
  else {
    const pod = $('podium');
    const maxX = Math.max(0, (img.clientWidth * viewer.z - pod.clientWidth) / 2 + 40);
    const maxY = Math.max(0, (img.clientHeight * viewer.z - pod.clientHeight) / 2 + 40);
    viewer.x = Math.max(-maxX, Math.min(maxX, viewer.x));
    viewer.y = Math.max(-maxY, Math.min(maxY, viewer.y));
  }
  img.style.transform = `translate(${viewer.x}px, ${viewer.y}px) scale(${viewer.z})`;
}
function zoomOm(nieuw, cx, cy) {
  const p = $('podium').getBoundingClientRect();
  const px = cx - p.left - p.width / 2, py = cy - p.top - p.height / 2;
  nieuw = Math.max(1, Math.min(6, nieuw));
  const f = nieuw / viewer.z;
  zetZoom(nieuw, px - (px - viewer.x) * f, py - (py - viewer.y) * f);
}
const wijzers = new Map();
let gebaar = null, laatsteTik = 0, tikKlok = null;
const podium = $('podium');
podium.addEventListener('pointerdown', e => {
  try { podium.setPointerCapture(e.pointerId); } catch {}
  wijzers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  $('vFoto').style.transition = 'none';
  if (wijzers.size === 2) {
    const [a, b] = [...wijzers.values()];
    gebaar = { soort: 'knijp', afstand: Math.hypot(a.x - b.x, a.y - b.y), z: viewer.z, cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2, x: viewer.x, y: viewer.y };
  } else gebaar = { soort: 'een', sx: e.clientX, sy: e.clientY, x: viewer.x, y: viewer.y, t: Date.now(), bewogen: false };
});
podium.addEventListener('pointermove', e => {
  if (!wijzers.has(e.pointerId) || !gebaar) return;
  wijzers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const img = $('vFoto');
  if (gebaar.soort === 'knijp' && wijzers.size === 2) {
    const [a, b] = [...wijzers.values()];
    const f = Math.hypot(a.x - b.x, a.y - b.y) / gebaar.afstand;
    viewer.z = gebaar.z; viewer.x = gebaar.x; viewer.y = gebaar.y;
    zoomOm(gebaar.z * f, gebaar.cx, gebaar.cy);
  } else if (gebaar.soort === 'een') {
    const dx = e.clientX - gebaar.sx, dy = e.clientY - gebaar.sy;
    if (Math.hypot(dx, dy) > 6) gebaar.bewogen = true;
    if (viewer.z > 1) zetZoom(viewer.z, gebaar.x + dx, gebaar.y + dy);
    else if (gebaar.bewogen) img.style.transform = Math.abs(dy) > Math.abs(dx) && dy > 0 ? `translateY(${dy}px) scale(${1 - Math.min(dy, 300) / 1500})` : `translateX(${dx}px)`;
  }
});
function pointerEinde(e) {
  if (!wijzers.has(e.pointerId)) return;
  wijzers.delete(e.pointerId);
  const img = $('vFoto');
  if (!gebaar) return;
  if (gebaar.soort === 'knijp') { if (wijzers.size === 0) gebaar = null; else { const [a] = [...wijzers.values()]; gebaar = { soort: 'een', sx: a.x, sy: a.y, x: viewer.x, y: viewer.y, t: Date.now(), bewogen: true }; } return; }
  const dx = e.clientX - gebaar.sx, dy = e.clientY - gebaar.sy;
  img.style.transition = 'transform 0.2s ease';
  if (viewer.z === 1 && gebaar.bewogen) {
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) { img.style.transform = ''; naarFoto(dx < 0 ? 1 : -1); }
    else if (dy > 110 && Math.abs(dy) > Math.abs(dx)) { sluitViewer(); }
    else zetZoom(1, 0, 0);
  } else if (!gebaar.bewogen && e.type === 'pointerup') {
    const nu = Date.now();
    if (nu - laatsteTik < 300) { clearTimeout(tikKlok); laatsteTik = 0; if (viewer.z > 1) zetZoom(1, 0, 0); else zoomOm(2.5, e.clientX, e.clientY); }
    else { laatsteTik = nu; tikKlok = setTimeout(() => $('viewer').classList.toggle('rustig'), 300); }
  }

}
podium.addEventListener('pointerup', pointerEinde);
podium.addEventListener('pointercancel', pointerEinde);
podium.addEventListener('wheel', e => { e.preventDefault(); $('vFoto').style.transition = 'none'; zoomOm(viewer.z * Math.exp(-e.deltaY * 0.0025), e.clientX, e.clientY); }, { passive: false });

/* ---------- Toetsenbord ---------- */
document.addEventListener('keydown', e => {
  if (ed.open) return;   // de tekstverwerker regelt zijn eigen toetsen
  if (speler.open) {
    const v = $('sVideo');
    if (e.target && e.target.tagName === 'INPUT' && e.key !== 'Escape' && e.key !== ' ') return;
    if (e.key === 'Escape') { if (!document.fullscreenElement) sluitSpeler(); }
    else if (e.key === ' ' || e.key === 'k') { e.preventDefault(); speelPauze(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); v.currentTime = Math.max(0, v.currentTime - 5); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); v.currentTime = Math.min(v.duration || 0, v.currentTime + 5); }
    else if (e.key === 'm') v.muted = !v.muted;
    else if (e.key === 'f') $('sVol').click();
    return;
  }
  if (viewer.open) {
    if (e.key === 'Escape') sluitViewer();
    else if (e.key === 'ArrowLeft') naarFoto(-1);
    else if (e.key === 'ArrowRight') naarFoto(1);
    return;
  }
  if ($('venster').classList.contains('open') || document.querySelector('.menu')) { if (e.key === 'Escape') sluitMenu(); return; }
  const inVeld = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (inVeld || zoek || !huidigPad || huidigPad === '#bak' || $('appView').hidden) return;
  const cmd = e.metaKey || e.ctrlKey;
  if (e.key === '/' || (cmd && e.key.toLowerCase() === 'f')) { e.preventDefault(); return openZoeken(); }
  // tabbladen: Alt+T nieuw, Alt+W sluiten, Alt+1..9 kiezen (Ctrl/Cmd+T houdt de browser meestal voor zichzelf)
  if ((e.altKey && e.code === 'KeyT') || (cmd && !e.shiftKey && e.key.toLowerCase() === 't')) { e.preventDefault(); return nieuwTab(); }
  if (e.altKey && e.code === 'KeyW') { e.preventDefault(); return sluitTab(tabNr); }
  if (e.altKey && /^Digit[1-9]$/.test(e.code)) { e.preventDefault(); return kiesTab(Math.min(+e.code.slice(5), tabs.length) - 1); }
  if ((e.altKey && e.key === 'ArrowLeft') || (cmd && e.key === '[')) { e.preventDefault(); return stap(-1); }
  if ((e.altKey && e.key === 'ArrowRight') || (cmd && e.key === ']')) { e.preventDefault(); return stap(1); }
  if (cmd && e.key.toLowerCase() === 'a') { e.preventDefault(); zichtbaar.forEach(i => gekozen.add(padItem(i))); updateSelectie(); }
  else if (cmd && e.key.toLowerCase() === 'c' && gekozen.size) { e.preventDefault(); naarKlembord('kopie'); }
  else if (cmd && e.key.toLowerCase() === 'x' && gekozen.size) { e.preventDefault(); naarKlembord('knip'); }
  else if (cmd && e.key.toLowerCase() === 'v' && klembord) { e.preventDefault(); plak(); }
  else if ((e.key === 'Delete' || (cmd && e.key === 'Backspace')) && gekozen.size) { e.preventDefault(); verwijder(gekozenItems()); }
  else if (e.key === 'F2' && gekozen.size === 1) { e.preventDefault(); hernoem(gekozenItems()[0]); }
  else if (e.key === 'Enter' && gekozen.size === 1) { e.preventDefault(); open(gekozenItems()[0]); }
  else if (e.key === 'Escape' && gekozen.size) { gekozen.clear(); updateSelectie(); }
  else if (e.key === 'Backspace' && !cmd) { const op = huidigPad.split('/').slice(0, -1).join('/'); if (op) ga(op); }
});

/* ---------- Terug naar boven ---------- */
function werkNaarBovenBij() {
  const lang = !$('appView').hidden && window.scrollY > Math.max(700, window.innerHeight * 1.2);

}

/* ---------- Dag- en nachtmodus ---------- */
function zetThema(t) {
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
  document.querySelectorAll('#thema button').forEach(b => b.classList.toggle('on', b.dataset.t === t));

}
// telefoon: geen dag/nacht-knop, de app volgt gewoon de instelling van je telefoon
if (window.innerWidth <= 640) { document.documentElement.removeAttribute('data-theme'); document.querySelectorAll('#thema button').forEach(b => b.classList.toggle('on', b.dataset.t === 'auto')); }
else zetThema(opslagLees('fm_thema', 'auto'));
document.querySelectorAll('#thema button').forEach(b => b.addEventListener('click', () => zetThema(b.dataset.t)));

/* ---------- Start ---------- */
function meetBoven() {
  const h = document.querySelector('.hoofd');
  if (h && !$('appView').hidden) document.documentElement.style.setProperty('--boven', Math.round(h.getBoundingClientRect().top + scrollY) + 'px');
}
window.addEventListener('resize', meetBoven);
function balkOnder() {
  const zichtbaar = !$('selectiebalk').hidden || !$('plakbalk').hidden || $('takenLijst').children.length > 0;
  document.body.classList.toggle('balk-onder', zichtbaar);
}
new MutationObserver(balkOnder).observe($('onder'), { subtree: true, childList: true, attributes: true, attributeFilter: ['hidden'] });

async function start() {
  try {
    const r = await fetch('api/ik', { credentials: 'same-origin' });
    if (r.status !== 200) return toonLogin();
  } catch { $('loginMsg').textContent = 'Geen verbinding met de server'; return toonLogin(); }
  $('loginView').hidden = true; $('appView').hidden = false; $('uitlogBtn').hidden = false; $('takenBtn').hidden = false;

  if (serverVersie !== VERSIE) setTimeout(() => toast(`Let op: de server (server.js) hoort niet bij deze pagina (index.html)${serverVersie ? ` (server ${serverVersie}, pagina ${VERSIE})` : ''}. Vervang beide bestanden en herstart files-web, anders werkt niet alles goed.`, null, null, 20000), 800);
  if (!location.hash && tabs[tabNr].pad) history.replaceState(null, '', hashVoor(tabs[tabNr].pad));
  laadHuidig();
  laadBakAantal();
  laadFavorieten();
  volgTaken();
  meetBoven();
  if (opslagLees('fm_zijbalk_in', false) === true) zetZijbalk(true, false);
  requestAnimationFrame(pasZijbalk);
}
start();
